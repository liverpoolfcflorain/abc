<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>ABC XIV — Category Study Guide</title>

<style>
  :root {
    --bg-void: #040A12;
    --bg-deep: #060d16;
    --bg-surface: #0a111c;
    --border-subtle: #141b26;
    --border-medium: #1e2630;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-bronze: #b8860b;
    --accent-gold: #d4af37;
    --accent-gold-bright: #ffd700;
    --accent-gold-dim: rgba(212,175,55,0.12);
    --accent-steel: #4a5568;
    --card-hover-border: #ffd700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-void);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-void); }
  ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 0; }

  /* NAVIGATION */
  nav {
    position: fixed;
    top: 0; width: 100%;
    background: rgba(4,10,18,0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    z-index: 1000;
    padding: 0.875rem 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    text-decoration: none;
  }

  .nav-brand img {
    height: 40px;
    width: auto;
  }

  .nav-brand span {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-brand span strong {
    color: var(--accent-gold-bright);
    font-weight: 800;
    font-family: 'Cinzel', serif;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
    align-items: center;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.25s;
  }

  .nav-links a:hover, .nav-links a.active {
    color: var(--accent-gold-bright);
  }

  .mobile-menu-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--accent-gold);
    border-radius: 4px;
    padding: 0.5rem;
    cursor: pointer;
    z-index: 1001;
    transition: all 0.3s ease;
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
  }

  .mobile-menu-btn svg {
    display: block;
    width: 22px;
    height: 22px;
  }

  /* CONTAINER */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 6rem 5% 4rem;
  }

  /* HERO HEADER */
  .header-section {
    text-align: center;
    padding: 2.5rem 0 3rem;
    font-family: 'Cinzel', serif;
  }

  .header-section h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: #fff;
  }

  .header-section h1 span {
    color: var(--accent-gold-bright);
  }

  .header-section .subtitle {
    font-size: 1.05rem;
    color: var(--text-secondary);
    max-width: 750px;
    margin: 0 auto 1.5rem;
  }

  .badge-tag {
    display: inline-block;
    padding: 0.35rem 1rem;
    border: 1px solid var(--accent-bronze);
    background: var(--accent-gold-dim);
    color: var(--accent-gold-bright);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 50px;
    margin-bottom: 1.5rem;
  }

  /* SEARCH & CONTROLS */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3rem;
    background: var(--bg-surface);
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 260px;
  }

  .search-box input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    background: var(--bg-deep);
    border: 1px solid var(--border-medium);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
  }

  .search-box input:focus {
    border-color: var(--accent-gold-bright);
  }

  .search-box i {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  .filter-pills {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--bg-deep);
    border: 1px solid var(--border-medium);
    color: var(--text-secondary);
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--accent-gold-bright);
    color: var(--bg-void);
    border-color: var(--accent-gold-bright);
  }

  /* CATEGORIES GRID */
  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 2rem;
  }

  .category-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.35s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
  }

  .category-card:hover {
    border-color: var(--card-hover-border);
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.25);
  }

  .card-banner {
    position: relative;
    height: 180px;
    background: #02060c;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border-subtle);
  }

  .card-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .category-card:hover .card-banner img {
    transform: scale(1.06);
  }

  .card-category-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(4,10,18,0.85);
    border: 1px solid var(--border-medium);
    color: var(--accent-gold-bright);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .card-body {
    padding: 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .category-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 0.35rem;
    text-transform: uppercase;
  }

  .category-tagline {
    font-size: 0.8rem;
    color: var(--accent-gold-bright);
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .category-desc {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
    flex: 1;
  }

  .guide-section-box {
    background: var(--bg-deep);
    border-left: 3px solid var(--accent-gold);
    padding: 0.875rem 1rem;
    margin-bottom: 1rem;
    border-radius: 0 4px 4px 0;
  }

  .guide-section-box h4 {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-gold-bright);
    margin-bottom: 0.35rem;
  }

  .guide-section-box p, .guide-section-box ul {
    font-size: 0.825rem;
    color: var(--text-primary);
  }

  .guide-section-box ul {
    padding-left: 1.2rem;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 1rem;
    border-top: 1px solid var(--border-subtle);
    margin-top: auto;
  }

  .pro-tip {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* MODAL FOR FULL STUDY GUIDE */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--bg-void);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-content {
    background: var(--bg-deep);
    border: 1px solid var(--accent-gold);
    border-radius: 8px;
    max-width: 800px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 2.5rem;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
  }

  .close-modal {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    background: transparent;
    border: 1px solid var(--border-medium);
    color: var(--text-secondary);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.25s;
  }

  .close-modal:hover {
    color: var(--accent-gold-bright);
    border-color: var(--accent-gold-bright);
  }

  .modal-header {
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 1rem;
  }

  .modal-header h2 {
    font-size: 1.75rem;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .modal-header p {
    color: var(--accent-gold-bright);
    font-size: 0.85rem;
    letter-spacing: 1px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .modal-body h3 {
    font-size: 0.9rem;
    color: var(--accent-gold-bright);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 1.5rem 0 0.5rem;
  }

  .modal-body p, .modal-body ul {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .modal-body ul {
    padding-left: 1.5rem;
    margin-bottom: 1rem;
  }

  .modal-body li {
    margin-bottom: 0.4rem;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 3rem 2rem;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 5rem;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .header-section h1 { font-size: 1.75rem; }
    .categories-grid { grid-template-columns: 1fr; }
    .controls-bar { flex-direction: column; align-items: stretch; }
    .mobile-menu-btn { display: flex; }
    .nav-links {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 75%; height: 100vh;
      background: var(--bg-deep);
      flex-direction: column;
      padding: 5rem 2rem;
      border-left: 1px solid var(--border-subtle);
      z-index: 1000;
    }
    .nav-links.show { display: flex; }
  }
</style>
</head>

    "overview": "The Amazing Race is an interactive category designed to test delegates' thinking and detective skills through a simulated scavenger hunt.",
    "rounds": [],
    "details": "The competition is simulated as a scavenger hunt and is designed to test delegates' thinking skills alongside their detective skills."
  },
  {
    "id": "juris",
    "name": "Jurisprudential",
    "tagline": "Corporate Law & Courtroom Advocacy",
    "type": "strategy",
    "img": "XIII Vectors/Juris raw.png",
    "overview": "This category tests delegates' ability to understand legal issues in a corporate setting, propose practical legal corrections, and apply legal principles through structured argument and courtroom advocacy.",
    "rounds": [
      "Round 1 — Contract Analysis & Rectification",
      "Round 2 — Corporate Crime Moot Court"
    ],
    "details": "The category combines corporate legal analysis with courtroom advocacy. Delegates work through legal issues and propose corrections before applying legal principles through structured arguments and cross-questioning in a moot-court setting."
  }
];

  // RENDER CATEGORY CARDS
  function renderCategories(items) {
    const grid = document.getElementById('categoriesGrid');
    grid.innerHTML = '';

    if (items.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: var(--text-muted);">No categories match your search query.</div>';
      return;
    }

    items.forEach((cat) => {
      const card = document.createElement('div');
      card.className = 'category-card';
      card.setAttribute('onclick', `openModal('${cat.id}')`);
      card.innerHTML = `
        <div class="card-banner">
          <img src="${cat.img}" alt="${cat.name}" loading="lazy">
          <span class="card-category-badge">${cat.type}</span>
        </div>
        <div class="card-body">
          <h3 class="category-title">${cat.name}</h3>
          <div class="category-tagline">${cat.tagline}</div>
          <p class="category-desc">${cat.overview}</p>
          
          <div class="guide-section-box">
            <h4>Competition Rounds</h4>
            <ul>
              ${cat.rounds.length ? cat.rounds.slice(0, 2).map(r => `<li>${r}</li>`).join('') : '<li>Scavenger hunt</li>'}
            </ul>
          </div>

          <div class="card-footer">
            <span class="pro-tip"><i class="fas fa-lightbulb" style="color:var(--accent-gold-bright);"></i> </span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // INITIAL RENDER
  renderCategories(studyGuideData);

  // SEARCH FILTER
  function filterCategories() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = studyGuideData.filter(cat => 
      cat.name.toLowerCase().includes(query) || 
      cat.tagline.toLowerCase().includes(query) ||
      cat.overview.toLowerCase().includes(query) ||
      cat.keyConcepts.some(c => c.toLowerCase().includes(query))
    );
    renderCategories(filtered);
  }

  // PILL FILTER
  function filterPill(categoryType, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (categoryType === 'all') {
      renderCategories(studyGuideData);
    } else {
      const filtered = studyGuideData.filter(cat => cat.type.toLowerCase() === categoryType.toLowerCase());
      renderCategories(filtered);
    }
  }

  // MODAL FUNCTIONS
  function openModal(catId) {
    const cat = studyGuideData.find(c => c.id === catId);
    if (!cat) return;

    document.getElementById('modalTitle').textContent = cat.name;
    document.getElementById('modalTagline').textContent = cat.tagline;

    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML = `
      <h3>Category Overview</h3>
      <p>${cat.overview}</p>
      ${cat.rounds.length ? `<h3>Competition Rounds</h3><ul>${cat.rounds.map(r => `<li>${r}</li>`).join('')}</ul>` : ''}
      <h3>Study Guide</h3>
      <p>${cat.details}</p>
    `;

    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target.id === 'modalOverlay') {
      closeModalDirect();
    }
  }

  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  function toggleMenu() {
    document.getElementById('navLinks').classList.toggle('show');
  }
</script>
</body>
</html>
