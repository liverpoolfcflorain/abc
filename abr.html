




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ABR — Digital Magazine</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07080b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #0c0e13;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      z-index: 20;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 3px;
      font-size: 15px;
      font-weight: 700;
    }

    .page-counter {
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .reader {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px 70px 72px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.055), transparent 52%),
        #07080b;
    }

    #book {
      position: relative;
      width: min(86vw, 1100px);
      height: min(76vh, 780px);
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      background: #07080b;
      transition: opacity .35s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .nav button {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(8, 9, 12, .82);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .nav button:hover {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.55);
    }

    .nav button:active {
      transform: translateY(-50%) scale(.94);
    }

    #prev {
      left: 14px;
    }

    #next {
      right: 14px;
    }

    .bottom-bar {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(620px, calc(100% - 40px));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .progress {
      flex: 1;
      height: 3px;
      appearance: none;
      background: rgba(255,255,255,.2);
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .progress::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.4);
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
    }

    .error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: #07080b;
    }

    .error.show {
      display: flex;
    }

    .error-inner {
      max-width: 500px;
    }

    .error h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .error p {
      margin: 0;
      color: rgba(255,255,255,.65);
      line-height: 1.6;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 52px;
        flex-basis: 52px;
        padding: 0 15px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .reader {
        padding: 8px 8px 60px;
      }

      #book {
        width: min(94vw, 560px);
        height: min(78vh, 760px);
      }

      .nav button {
        width: 40px;
        height: 40px;
        background: rgba(8, 9, 12, .65);
      }

      #prev {
        left: 6px;
      }

      #next {
        right: 6px;
      }

      .hint {
        display: none;
      }

      .bottom-bar {
        bottom: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">ABR</div>
    <div class="page-counter" id="counter">Loading…</div>
  </header>

  <main class="reader">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Opening magazine</div>
    </div>

    <div id="book"></div>

    <div class="nav">
      <button id="prev" aria-label="Previous page">‹</button>
      <button id="next" aria-label="Next page">›</button>
    </div>

    <div class="hint">SWIPE OR DRAG THE PAGE CORNER TO TURN</div>

    <div class="bottom-bar">
      <input id="progress" class="progress" type="range" min="1" max="102" value="1">
    </div>

    <div class="error" id="error">
      <div class="error-inner">
        <h2>Unable to open the magazine</h2>
        <p id="errorText">
          Make sure <strong>ABR.pdf</strong> is in the same folder as this index.html file
          and open the site through a local/server URL rather than directly from a restricted file URL.
        </p>
      </div>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_URL = "ABR.pdf";
const TOTAL_PAGES = 102;

let pdf = null;
let flipBook = null;

let currentPage = 1;
let pageWidth = 595;
let pageHeight = 842;

const renderedPages = new Set();
const loadingPages = new Set();

const bookEl = document.getElementById("book");
const counterEl = document.getElementById("counter");
const progressEl = document.getElementById("progress");

const loadingEl = document.getElementById("loading");
const loadingTextEl = document.getElementById("loadingText");

const errorEl = document.getElementById("error");
const errorTextEl = document.getElementById("errorText");


/* =========================================================
   LOADING / ERROR
========================================================= */

function setLoading(text) {
  if (loadingTextEl) {
    loadingTextEl.textContent = text;
  }
}


function hideLoading() {
  if (loadingEl) {
    loadingEl.classList.add("hidden");
  }
}


function showError(message) {

  console.error(message);

  if (errorTextEl) {
    errorTextEl.textContent = message;
  }

  if (errorEl) {
    errorEl.classList.add("show");
  }

  hideLoading();
}


/* =========================================================
   PAGE COUNTER
========================================================= */

function updateCounter(pageNumber) {

  currentPage = Math.max(
    1,
    Math.min(TOTAL_PAGES, pageNumber)
  );

  if (counterEl) {
    counterEl.textContent =
      `${currentPage} / ${TOTAL_PAGES}`;
  }

  if (progressEl) {
    progressEl.value = currentPage;
  }
}


/* =========================================================
   CREATE PAGE ELEMENTS
========================================================= */

function createPageElement(pageNumber) {

  const page = document.createElement("div");

  page.className = "page";

  page.dataset.pageNumber = pageNumber;
  page.dataset.rendered = "false";

  const canvas = document.createElement("canvas");

  canvas.className = "pdf-page";

  canvas.setAttribute(
    "aria-label",
    `Magazine page ${pageNumber}`
  );

  page.appendChild(canvas);

  return page;
}


/* =========================================================
   CREATE ALL EMPTY PAGE CONTAINERS
========================================================= */

function createPageContainers() {

  const fragment =
    document.createDocumentFragment();

  for (
    let pageNumber = 1;
    pageNumber <= TOTAL_PAGES;
    pageNumber++
  ) {

    fragment.appendChild(
      createPageElement(pageNumber)
    );

  }

  bookEl.appendChild(fragment);
}


/* =========================================================
   GET PAGE ELEMENT
========================================================= */

function getPageElement(pageNumber) {

  return bookEl.querySelector(
    `.page[data-page-number="${pageNumber}"]`
  );

}


/* =========================================================
   RENDER ONE PAGE
========================================================= */

async function renderPage(pageNumber) {

  /*
    Don't render a page twice.
  */

  if (renderedPages.has(pageNumber)) {
    return;
  }


  /*
    Don't allow the same page to be
    rendered multiple times simultaneously.
  */

  if (loadingPages.has(pageNumber)) {
    return;
  }


  if (
    pageNumber < 1 ||
    pageNumber > TOTAL_PAGES
  ) {
    return;
  }


  loadingPages.add(pageNumber);


  try {

    console.log(
      `Rendering page ${pageNumber}`
    );


    /*
      Get the PDF page.
    */

    const pdfPage =
      await pdf.getPage(pageNumber);


    /*
      Find the corresponding HTML page.
    */

    const pageElement =
      getPageElement(pageNumber);


    if (!pageElement) {
      return;
    }


    const canvas =
      pageElement.querySelector("canvas");


    if (!canvas) {
      return;
    }


    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    /*
      Get the original PDF dimensions.
    */

    const baseViewport =
      pdfPage.getViewport({
        scale: 1
      });


    /*
      Determine available space.
    */

    const containerWidth =
      pageElement.clientWidth ||
      bookEl.clientWidth ||
      600;


    const containerHeight =
      pageElement.clientHeight ||
      bookEl.clientHeight ||
      800;


    /*
      Fit the PDF page inside
      the flipbook page.
    */

    const widthScale =
      containerWidth /
      baseViewport.width;


    const heightScale =
      containerHeight /
      baseViewport.height;


    const scale =
      Math.min(
        widthScale,
        heightScale
      );


    /*
      Device pixel ratio gives
      sharper pages on Retina displays.
    */

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const viewport =
      pdfPage.getViewport({
        scale: scale * dpr
      });


    /*
      Set canvas resolution.
    */

    canvas.width =
      Math.floor(viewport.width);

    canvas.height =
      Math.floor(viewport.height);


    /*
      Keep the canvas visually
      inside the page.
    */

    canvas.style.width = "100%";
    canvas.style.height = "100%";


    /*
      Render PDF → Canvas.
    */

    await pdfPage.render({

      canvasContext: context,

      viewport: viewport,

      background: "white"

    }).promise;


    /*
      Mark page as finished.
    */

    renderedPages.add(pageNumber);

    pageElement.dataset.rendered =
      "true";


    console.log(
      `Finished page ${pageNumber}`
    );


  } catch (error) {

    console.error(
      `Failed to render page ${pageNumber}`,
      error
    );


  } finally {

    loadingPages.delete(pageNumber);

  }

}


/* =========================================================
   PRELOAD FIRST 3 PAGES
========================================================= */

async function preloadFirstPages() {

  /*
    IMPORTANT:
    These are deliberately loaded
    one after another.

    1 → finish
    2 → finish
    3 → finish
  */

  for (
    let pageNumber = 1;
    pageNumber <= 3;
    pageNumber++
  ) {

    setLoading(
      `Loading page ${pageNumber} of 3`
    );

    await renderPage(pageNumber);

  }

}


/* =========================================================
   LOAD NEXT PAGE WHEN REQUIRED
========================================================= */

async function loadPageOnDemand(pageNumber) {

  if (
    pageNumber < 1 ||
    pageNumber > TOTAL_PAGES
  ) {
    return;
  }


  /*
    Render ONLY this page.
  */

  await renderPage(pageNumber);

}


/* =========================================================
   PREPARE NEXT PAGE
========================================================= */

function preloadNextPage(pageNumber) {

  const nextPage =
    pageNumber + 1;


  if (
    nextPage > TOTAL_PAGES
  ) {
    return;
  }


  /*
    Wait until the page turn has
    completed before rendering the
    next page.

    This prevents several pages
    loading together.
  */

  setTimeout(() => {

    renderPage(nextPage);

  }, 250);

}


/* =========================================================
   PREPARE PREVIOUS PAGE
========================================================= */

function preloadPreviousPage(pageNumber) {

  const previousPage =
    pageNumber - 1;


  if (
    previousPage < 1
  ) {
    return;
  }


  setTimeout(() => {

    renderPage(previousPage);

  }, 250);

}


/* =========================================================
   PAGE TURN EVENT
========================================================= */

function setupFlipEvents() {

  flipBook.on(
    "flip",
    async (event) => {

      /*
        StPageFlip uses a zero-based index.
      */

      const pageNumber =
        event.data + 1;


      updateCounter(
        pageNumber
      );


      /*
        Render the page the user
        has just reached.
      */

      await loadPageOnDemand(
        pageNumber
      );


      /*
        Prepare ONLY the next page.
      */

      preloadNextPage(
        pageNumber
      );


      /*
        Prepare ONLY the previous page.
      */

      preloadPreviousPage(
        pageNumber
      );

    }
  );


  /*
    Orientation changes.
  */

  flipBook.on(
    "changeOrientation",
    () => {

      /*
        Give the browser time
        to resize the book.
      */

      setTimeout(() => {

        /*
          We don't re-render
          everything here.

          Existing pages remain
          cached.
        */

        loadPageOnDemand(
          currentPage
        );

      }, 150);

    }
  );

}


/* =========================================================
   GO TO PAGE
========================================================= */

async function goToPage(pageNumber) {

  pageNumber =
    Math.max(
      1,
      Math.min(
        TOTAL_PAGES,
        Number(pageNumber)
      )
    );


  if (!flipBook) {
    return;
  }


  /*
    Make sure the destination
    page has been rendered.
  */

  await renderPage(
    pageNumber
  );


  /*
    PageFlip is zero-indexed.
  */

  flipBook.flip(
    pageNumber - 1
  );


  updateCounter(
    pageNumber
  );

}


/* =========================================================
   INITIALIZE FLIPBOOK
========================================================= */

async function initializeFlipbook() {

  try {

    setLoading(
      "Opening magazine..."
    );


    /*
      Load PDF.
    */

    pdf =
      await pdfjsLib
        .getDocument({
          url: PDF_URL,

          /*
            Normal network loading.
          */

          disableAutoFetch: false,

          disableStream: false

        })
        .promise;


    console.log(
      `PDF loaded: ${pdf.numPages} pages`
    );


    /*
      Verify page count.
    */

    if (
      pdf.numPages !== TOTAL_PAGES
    ) {

      console.warn(
        `Expected ${TOTAL_PAGES} pages but PDF contains ${pdf.numPages}`
      );

    }


    /*
      Get dimensions from page 1.
    */

    const firstPage =
      await pdf.getPage(1);


    const firstViewport =
      firstPage.getViewport({
        scale: 1
      });


    pageWidth =
      firstViewport.width;


    pageHeight =
      firstViewport.height;


    /*
      Create the empty page
      containers.
    */

    createPageContainers();


    /*
      Determine whether we're
      on mobile.
    */

    const isMobile =
      window.matchMedia(
        "(max-width: 700px)"
      ).matches;


    /*
      Calculate proper PDF ratio.
    */

    const aspectRatio =
      pageHeight / pageWidth;


    let bookWidth;

    if (isMobile) {

      bookWidth =
        Math.min(
          window.innerWidth * 0.90,
          560
        );

    } else {

      bookWidth =
        Math.min(
          window.innerWidth * 0.42,
          620
        );

    }


    const bookHeight =
      bookWidth * aspectRatio;


    /*
      Create StPageFlip.
    */

    flipBook =
      new St.PageFlip(
        bookEl,
        {

          width:
            bookWidth,

          height:
            bookHeight,


          /*
            Allow the book to
            resize responsively.
          */

          size:
            "stretch",


          minWidth:
            280,

          maxWidth:
            900,


          minHeight:
            400,

          maxHeight:
            1200,


          /*
            IMPORTANT:
            Do not use showCover
            to avoid the initial
            pages being rotated/
            rearranged incorrectly.
          */

          showCover:
            false,


          /*
            Keep the page orientation
            consistent.
          */

          usePortrait:
            false,


          /*
            Mobile swipe support.
          */

          mobileScrollSupport:
            false,


          /*
            Page turn speed.
          */

          flippingTime:
            650,


          /*
            Page shadows.
          */

          drawShadow:
            true,

          maxShadowOpacity:
            0.35,


          /*
            Automatically size
            the flipbook.
          */

          autoSize:
            true,


          /*
            Start at page 1.
          */

          startPage:
            0,


          startZIndex:
            0

        }
      );


    /*
      Load the HTML page
      containers into PageFlip.
    */

    flipBook.loadFromHTML(
      Array.from(
        bookEl.querySelectorAll(
          ".page"
        )
      )
    );


    /*
      Attach events.
    */

    setupFlipEvents();


    /*
      Update initial counter.
    */

    updateCounter(1);


    /*
      IMPORTANT:
      Render only pages 1 → 2 → 3.
    */

    await preloadFirstPages();


    /*
      Hide loading screen
      after first 3 pages are
      ready.
    */

    setLoading(
      "Ready"
    );


    setTimeout(
      () => {

        hideLoading();

      },
      200
    );


    console.log(
      "Magazine ready."
    );


  } catch (error) {

    console.error(
      "Magazine initialization error:",
      error
    );


    showError(
      "The magazine could not be loaded. " +
      "Make sure ABR.pdf is beside index.html. " +
      "Error: " +
      (
        error &&
        error.message
          ? error.message
          : "Unknown error"
      )
    );

  }

}


/* =========================================================
   PREVIOUS BUTTON
========================================================= */

const previousButton =
  document.getElementById(
    "prev"
  );


if (previousButton) {

  previousButton.addEventListener(
    "click",
    () => {

      if (!flipBook) {
        return;
      }

      flipBook.flipPrev();

    }
  );

}


/* =========================================================
   NEXT BUTTON
========================================================= */

const nextButton =
  document.getElementById(
    "next"
  );


if (nextButton) {

  nextButton.addEventListener(
    "click",
    () => {

      if (!flipBook) {
        return;
      }

      flipBook.flipNext();

    }
  );

}


/* =========================================================
   PROGRESS BAR
========================================================= */

if (progressEl) {

  progressEl.min =
    1;

  progressEl.max =
    TOTAL_PAGES;

  progressEl.value =
    1;


  progressEl.addEventListener(
    "change",
    async (event) => {

      await goToPage(
        event.target.value
      );

    }
  );

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

window.addEventListener(
  "keydown",
  (event) => {

    if (!flipBook) {
      return;
    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      flipBook.flipPrev();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      flipBook.flipNext();

    }


    if (
      event.key ===
      "Home"
    ) {

      event.preventDefault();

      goToPage(1);

    }


    if (
      event.key ===
      "End"
    ) {

      event.preventDefault();

      goToPage(
        TOTAL_PAGES
      );

    }

  }
);


/* =========================================================
   RESPONSIVE RESIZE
========================================================= */

let resizeTimer = null;


window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        () => {

          if (!flipBook) {
            return;
          }


          /*
            Don't reload the PDF.

            Only resize the existing
            flipbook.
          */

          loadPageOnDemand(
            currentPage
          );

        },
        300
      );

  }
);


/* =========================================================
   START
========================================================= */

initializeFlipbook();
  </script>
</body>
</html>
